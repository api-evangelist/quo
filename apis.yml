name: Quo
description: >-
  Quo (formerly OpenPhone) is an AI-powered business communication platform that
  unifies calls, texts, and contacts in one shared workspace for startups and
  small businesses. Its REST Public API (https://api.quo.com/v1) lets developers
  send and receive SMS, manage contacts, conversations, and tasks, retrieve
  AI-generated call summaries and transcripts, and subscribe to
  Standard-Webhooks-signed events for messages and calls. Authentication is via a
  workspace API key sent in the Authorization header. This profile was added to
  the API Evangelist network from VC portfolio discovery and enriched from Quo's
  live developer documentation and published OpenAPI.
